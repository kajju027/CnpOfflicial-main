    function isMobileDevice() {
      var ua = navigator.userAgent || navigator.vendor || '';
      if (/android|iphone|ipad|ipod|iemobile|blackberry|opera mini|mobile/i.test(ua)) return true;
      if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return true;
      return false;
    }

    function startPopunder() {
      if (!initialPopupClosed) return;
      if (popunderState === 'loading' || popunderState === 'ready') return;
      if (navigator.onLine === false) return;

      clearTimeout(popunderRetryTimer);
      popunderRetryTimer = null;
      popunderState = 'loading';

      var adScript = document.createElement('script');
      adScript.setAttribute('data-cfasync', 'false');
      adScript.setAttribute('fetchpriority', 'high');
      adScript.async = true;

      adScript.onload = function () {
        popunderState = 'ready';
        adScript.onload = adScript.onerror = null;
      };

      adScript.onerror = function () {
        adScript.onload = adScript.onerror = null;
        if (adScript.parentNode) adScript.parentNode.removeChild(adScript);
        popunderState = 'failed';
        if (popunderRetryCount < popunderRetryDelays.length) {
          popunderRetryTimer = setTimeout(startPopunder, popunderRetryDelays[popunderRetryCount++]);
        }
      };

      adScript.src = SITE_AD_URL;
      document.body.appendChild(adScript);
    }

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible') return;
      if (popunderState !== 'failed') return;
      popunderRetryCount = 0;
      startPopunder();
    }, false);

    window.addEventListener('pageshow', function (e) {
      if (!e.persisted) return;
      bellBusy = false;
      var svg = document.getElementById('bellSvg');
      if (svg) {
        svg.classList.remove('ringing');
        svg.classList.add('idle');
      }
      if (initialPopupClosed && popunderState !== 'loading' && popunderState !== 'ready') {
        popunderRetryCount = 0;
        startPopunder();
      }
    }, false);

    window.addEventListener('online', function () {
      if (popunderState === 'loading' || popunderState === 'ready') return;
      popunderRetryCount = 0;
      startPopunder();
    }, false);

    /* JOIN POPUP HANDLERS */
    function closePopup() {
      var popup = document.getElementById('popup');
      if (!popup || popup.style.display === 'none') return;
      popup.style.display = 'none';
      initialPopupClosed = true;
      startPopunder();
    }

    function joinNow() {
      closePopup();
      if (isMobileDevice()) {
        window.location.href = POPUP_JOIN_LINK;
      } else {
        window.open(POPUP_JOIN_LINK, '_blank', 'noopener,noreferrer');
      }
    }

    function alreadyJoined() {
      closePopup();
    }

    /* RANDOM VISUAL ACCENTS */
    function applyRandomJoinScheme() {
      var scheme = JOIN_SCHEMES[Math.floor(Math.random() * JOIN_SCHEMES.length)];
      var buttons = document.querySelectorAll('.btn-join-style, .btn-join-main');
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].style.background = scheme.bg;
        buttons[i].style.color = scheme.color;
      }
    }

    function applyRandomHeartColor() {
      var heart = document.getElementById('heartIcon');
      if (!heart) return;
      heart.style.fill = HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)];
    }

    /* PLAYER LOADING SHIMMER */
    function addShimmer() {
      var wrapper = document.getElementById('videoWrapper');
      if (!wrapper) return;

      var shimmer = document.createElement('div');
      shimmer.id = 'iframeShimmer';
      shimmer.setAttribute('aria-hidden', 'true');
      shimmer.style.cssText = [
        'position:absolute', 'inset:0', 'border-radius:inherit',
        'background:linear-gradient(90deg,#e2e8f0 25%,#f0f4f8 50%,#e2e8f0 75%)',
        'background-size:200% 100%', 'animation:shimmerSlide 1.4s linear infinite',
        'z-index:2', 'pointer-events:none'
      ].join(';');

      if (!document.getElementById('shimmerStyle')) {
        var st = document.createElement('style');
        st.id = 'shimmerStyle';
        st.textContent = '@keyframes shimmerSlide{0%{background-position:200% 0}100%{background-position:-200% 0}}';
        document.head.appendChild(st);
      }

      wrapper.style.position = 'relative';
      wrapper.insertBefore(shimmer, wrapper.firstChild);
    }

    function removeShimmer() {
      var s = document.getElementById('iframeShimmer');
      if (s && s.parentNode) s.parentNode.removeChild(s);
    }

    /* STREAM LOADER */
    function loadStream(targetId) {
      var frame = document.getElementById('videoFrame');
      var wrapper = document.getElementById('videoWrapper');
      var titleEl = document.getElementById('pageTitle');
      var errBox = document.getElementById('errorBox');

      if (!targetId) {
        if (wrapper) wrapper.style.display = 'none';
        if (errBox) errBox.style.display = 'block';
        if (titleEl) titleEl.innerText = 'STREAM NOT FOUND';
        return;
      }

      addShimmer();

      prefetchData().then(function (data) {
        var found = null;

        if (data && Array.isArray(data.iframes)) {
          var wanted = String(targetId).toLowerCase();
          found = data.iframes.find(function (x) {
            return x && x.id !== undefined && String(x.id).trim().toLowerCase() === wanted;
          });
        }

        if (found && found.iframeSrc) {
          var streamName = String(found.name || '').trim() || 'Live Stream';

          frame.addEventListener('load', function onLoad() {
            frame.removeEventListener('load', onLoad);
            removeShimmer();
          });

          frame.addEventListener('error', function onErr() {
            frame.removeEventListener('error', onErr);
            removeShimmer();
          });

          setTimeout(removeShimmer, 12000);

          frame.src = found.iframeSrc;
          if (titleEl) titleEl.innerText = streamName;
          document.title = streamName + ' \u2013 ' + SITE_NAME;
        } else {
          removeShimmer();
          if (wrapper) wrapper.style.display = 'none';
          if (errBox) errBox.style.display = 'block';
          if (titleEl) titleEl.innerText = 'STREAM NOT FOUND';
        }
      });
    }

    /* QUERY STRING / HASH PARSING */
    var IGNORED_KEYS = /^(utm_[a-z]+|fbclid|gclid|ref|source|v|t|_gl|mc_cid|mc_eid)$/i;

    function safeDecode(v) {
      try { return decodeURIComponent(String(v).replace(/\+/g, ' ')); }
      catch (e) { return String(v); }
    }

    function pickIdFromQuery(query) {
      var named = '';
      var bare = '';
      var pairs = String(query || '').replace(/^[?#]+/, '').split('&');

      for (var i = 0; i < pairs.length; i++) {
        if (!pairs[i]) continue;

        var eq = pairs[i].indexOf('=');
        var key = safeDecode(eq === -1 ? pairs[i] : pairs[i].slice(0, eq)).trim();
        var val = eq === -1 ? '' : safeDecode(pairs[i].slice(eq + 1)).trim();

        if (!key) continue;

        if (key.toLowerCase() === 'id') {
          if (val && !named) named = val;
        } else if (!val && !bare && !IGNORED_KEYS.test(key)) {
          bare = key;
        }
      }

      return named || bare;
    }

    function resolveTargetId() {
      var id = pickIdFromQuery(window.location.search);
      if (!id && window.location.hash) id = pickIdFromQuery(window.location.hash);
      return id ? id.trim().slice(0, 100) : '';
    }

    /* NOTIFICATION BELL (opens the bell advertisement) */
    var bellBusy = false;

    function openBellLink() {
      if (bellBusy) return;
      bellBusy = true;
      setTimeout(function () { bellBusy = false; }, 3000);

      if (isMobileDevice()) {
        setTimeout(function () { window.location.href = BELL_AD_URL; }, 650);
      } else {
        window.open(BELL_AD_URL, '_blank', 'noopener,noreferrer');
      }
    }

    function initBell() {
      var btn = document.getElementById('bellBtn');
      var svg = document.getElementById('bellSvg');
      if (!btn || !svg) return;

      function ring() {
        svg.classList.remove('idle', 'ringing');
        void svg.offsetWidth;
        svg.classList.add('ringing');
        setTimeout(function () {
          svg.classList.remove('ringing');
          svg.classList.add('idle');
        }, 700);
      }

      function activate() {
        ring();
        openBellLink();
      }

      btn.addEventListener('click', activate);
      btn.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          activate();
        }
      });
    }

    /* SHARE BUTTON */
    function initShareButton() {
      var btn = document.getElementById('shareButton');
      if (!btn) return;

      btn.addEventListener('click', function () {
        var url = window.location.href;
        var title = document.title;
        var text = title + '\n\nFrom ' + SITE_NAME + '\n\nWatch Live Cricket Streaming Free in HD !!';

        if (navigator.share) {
          navigator.share({ title: title, text: text, url: url }).catch(function () {});
          return;
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url)
            .then(function () { showToast('Link Copied to Clipboard !!'); })
            .catch(function () { fallbackCopy(url); });
        } else {
          fallbackCopy(url);
        }
      });
    }

    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0;';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        showToast('Link Copied to Clipboard !!');
      } catch (e) {
        alert('Link: ' + text);
      }
      document.body.removeChild(ta);
    }

    /* TOAST NOTIFICATION */
    function showToast(msg) {
      var old = document.getElementById('vcToast');
      if (old && old.parentNode) old.parentNode.removeChild(old);

      var toast = document.createElement('div');
      toast.id = 'vcToast';
      toast.textContent = msg;
      toast.style.cssText = [
        'position:fixed',
        'bottom:calc(20px + env(safe-area-inset-bottom,0px))',
        'left:50%',
        'transform:translateX(-50%) translateY(10px)',
        'background:rgba(30,41,59,0.92)',
        'color:#fff',
        'padding:10px 20px',
        'border-radius:24px',
        'font-size:13px',
        'font-family:inherit',
        'font-weight:500',
        'white-space:nowrap',
        'z-index:9999',
        'opacity:0',
        'transition:opacity 0.3s,transform 0.3s',
        'pointer-events:none',
        '-webkit-backdrop-filter:blur(8px)',
        'backdrop-filter:blur(8px)'
      ].join(';');

      document.body.appendChild(toast);

      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          toast.style.opacity = '1';
          toast.style.transform = 'translateX(-50%) translateY(0)';
        });
      });

      setTimeout(function () {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(10px)';
        setTimeout(function () {
          if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 350);
      }, 2400);
    }

    /* FULLSCREEN / ORIENTATION HANDLING */
    function initFullscreenHandler() {
      function handleFsChange() {
        var fsEl = document.fullscreenElement || document.webkitFullscreenElement ||
                   document.mozFullScreenElement || document.msFullscreenElement;
        if (fsEl && screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(function () {});
        }
      }

      document.addEventListener('fullscreenchange', handleFsChange);
      document.addEventListener('webkitfullscreenchange', handleFsChange);
      document.addEventListener('mozfullscreenchange', handleFsChange);
      document.addEventListener('MSFullscreenChange', handleFsChange);
    }

    /* LINK / BUTTON INITIALISATION */
    function initPageJoinLink() {
      var links = document.querySelectorAll('.btn-join-style');
      for (var i = 0; i < links.length; i++) {
        links[i].setAttribute('href', PAGE_JOIN_LINK);
      }
    }

    function initPopupButtons() {
      var btnJoin = document.getElementById('btnJoinNow');
      var btnJoined = document.getElementById('btnAlreadyJoined');
      if (btnJoin) btnJoin.addEventListener('click', joinNow);
      if (btnJoined) btnJoined.addEventListener('click', alreadyJoined);
    }

    /* BOOTSTRAP */
    document.addEventListener('DOMContentLoaded', function () {
      initPopupButtons();

      var firstBtn = document.getElementById('btnJoinNow');
      if (firstBtn) firstBtn.focus({ preventScroll: true });

      initPageJoinLink();
      initBell();
      initShareButton();
      initFullscreenHandler();
      applyRandomJoinScheme();
      applyRandomHeartColor();
      loadStream(resolveTargetId());
    });
  </script>
</body>

</html>
