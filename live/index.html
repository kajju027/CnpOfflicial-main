    var DATA_SOURCE_URL = 'https://sonujson-v6.pages.dev/loura.json';
    var POPUNDER_AD_URL = 'https://capitalhospitals.org/1/51a3b6b65851daea381cd4d4d707ac54';
    var BELL_AD_URL     = 'https://budgetezy.org/4/a3a82a6f8dbe39449d77beee8feae2df';

    var JOIN_SCHEMES = [
      { bg: 'linear-gradient(135deg,#43a047,#2e7d32)', color: '#fff',    shadow: 'rgba(67,160,71,.40)' },
      { bg: 'linear-gradient(90deg,#1bcc26,#17b823)',  color: '#fff',    shadow: 'rgba(27,204,38,.38)' },
      { bg: 'linear-gradient(90deg,#11f7e0,#0dcaba)',  color: '#003d36', shadow: 'rgba(17,247,224,.38)' },
      { bg: 'linear-gradient(90deg,#ffd60a,#ffb703)',  color: '#3d2b00', shadow: 'rgba(255,190,10,.42)' },
      { bg: 'linear-gradient(90deg,#ff5fa2,#ff2d78)',  color: '#fff',    shadow: 'rgba(255,93,162,.38)' },
      { bg: 'linear-gradient(90deg,#8e5bff,#6a35ff)',  color: '#fff',    shadow: 'rgba(142,91,255,.38)' }
    ];

    var joinScheme = JOIN_SCHEMES[Math.floor(Math.random() * JOIN_SCHEMES.length)];

    var HEART_COLORS = ['#ff4d6d', '#ff006e', '#f72585', '#ff8fa3', '#ffd60a', '#06d6a0', '#4cc9f0', '#9b5de5', '#ff9e00', '#ff5fa2'];

    var dataPromise = null;

    function fetchDataOnce() {
      return fetch(DATA_SOURCE_URL, { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
    }

    function prefetchData() {
      if (dataPromise) return dataPromise;
      dataPromise = fetchDataOnce().then(function (d) {
        if (d) return d;
        return new Promise(function (res) { setTimeout(res, 800); }).then(fetchDataOnce);
      });
      return dataPromise;
    }

    prefetchData();

    var popunderState = 'idle';
    var popunderRetryCount = 0;
    var popunderRetryTimer = null;
    var popunderRetryDelays = [500, 1500];
    var initialPopupClosed = false;

    function isMobileDevice() {
      var ua = navigator.userAgent || navigator.vendor || '';
      if (/android|iphone|ipad|ipod|iemobile|blackberry|opera mini|mobile/i.test(ua)) return true;
      if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return true;
      return false;
    }

    function startPopunder() {
      if (!POPUNDER_AD_URL) return;
      if (!initialPopupClosed) return;
      if (popunderState === 'loading' || popunderState === 'ready') return;
      if (navigator.onLine === false) return;

      clearTimeout(popunderRetryTimer);
      popunderRetryTimer = null;
      popunderState = 'loading';

      var adScript = document.createElement('script');
      adScript.setAttribute('data-cfasync', 'false');
      adScript.setAttribute('fetchpriority', 'high');
      adScript.async = true;

      adScript.onload = function () {
        popunderState = 'ready';
        adScript.onload = adScript.onerror = null;
      };

      adScript.onerror = function () {
        adScript.onload = adScript.onerror = null;
        if (adScript.parentNode) adScript.parentNode.removeChild(adScript);
        popunderState = 'failed';
        if (popunderRetryCount < popunderRetryDelays.length) {
          popunderRetryTimer = setTimeout(startPopunder, popunderRetryDelays[popunderRetryCount++]);
        }
      };

      adScript.src = POPUNDER_AD_URL;
      document.body.appendChild(adScript);
    }

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible') return;
      if (popunderState !== 'failed') return;
      popunderRetryCount = 0;
      startPopunder();
    }, false);

    window.addEventListener('pageshow', function (e) {
      if (!e.persisted) return;
      window.location.reload();
    }, false);

    window.addEventListener('online', function () {
      if (popunderState === 'loading' || popunderState === 'ready') return;
      popunderRetryCount = 0;
      startPopunder();
    }, false);

    var popupClosing = false;

    function openTab(url) {
      if (!url) return;
      var a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { if (a.parentNode) a.parentNode.removeChild(a); }, 150);
    }

    function closePopup() {
      var popup = document.getElementById('popup');
      if (!popup || popupClosing || popup.style.display === 'none') return;
      popupClosing = true;
      popup.style.transition = 'opacity .2s';
      popup.style.opacity = '0';
      popup.style.pointerEvents = 'none';
      popup.setAttribute('aria-hidden', 'true');
      setTimeout(function () {
        popup.style.display = 'none';
        popupClosing = false;
        initialPopupClosed = true;
        startPopunder();
      }, 220);
    }

    function buildJoinFrame() {
      var frame = document.getElementById('joinFrame');
      if (!frame) return;
      var html =
        '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
        '<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">' +
        '<link rel="preconnect" href="https://fonts.googleapis.com">' +
        '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
        '<link href="https://fonts.googleapis.com/css2?family=Amaranth:wght@700&display=swap" rel="stylesheet">' +
        '<style>' +
        '*{margin:0;padding:0;box-sizing:border-box}' +
        'html,body{width:100%;background:transparent;overflow:hidden;-webkit-tap-highlight-color:transparent}' +
        'button{width:100%;padding:14px;border:none;border-radius:12px;font-family:"Amaranth",sans-serif;' +
        'font-size:17px;font-weight:700;letter-spacing:.6px;line-height:1;text-align:center;cursor:pointer;' +
        '-webkit-user-select:none;user-select:none;-webkit-appearance:none;appearance:none;touch-action:manipulation;' +
        'display:block;transition:transform .18s;background:' + joinScheme.bg + ';box-shadow:0 5px 20px ' + joinScheme.shadow + ';color:' + joinScheme.color + '}' +
        'button:active{transform:scale(.95)}' +
        '</style></head><body>' +
        '<button type="button" id="jb">JOIN NOW</button>' +
        '<script>(function(){' +
        'document.getElementById("jb").addEventListener("click",function(e){' +
        'e.preventDefault();' +
        'try{parent.postMessage({type:"joinNowClicked"},"*");}catch(e){}' +
        '},false);' +
        'function reportHeight(){try{parent.postMessage({type:"joinFrameHeight",height:document.body.scrollHeight},"*");}catch(e){}}' +
        'window.addEventListener("load",function(){' +
        'reportHeight();' +
        'if(document.fonts&&document.fonts.ready){document.fonts.ready.then(reportHeight);}else{setTimeout(reportHeight,300);}' +
        '});' +
        'window.addEventListener("message",function(e){' +
        'if(e&&e.data&&e.data.type==="measureNow")reportHeight();' +
        '},false);' +
        '})();<\/script>' +
        '</body></html>';
      frame.setAttribute('srcdoc', html);
      setTimeout(function () {
        try { frame.contentWindow.postMessage({ type: 'measureNow' }, '*'); } catch (e) {}
      }, 300);
    }

    window.addEventListener('message', function (ev) {
      var frame = document.getElementById('joinFrame');
      if (!frame || ev.source !== frame.contentWindow) return;
      var d = ev.data;
      if (!d || typeof d !== 'object') return;
      if (d.type === 'joinNowClicked') {
        if (isMobileDevice()) {
          window.location.href = JOIN_LINK;
        } else {
          openTab(JOIN_LINK);
        }
        closePopup();
      } else if (d.type === 'joinFrameHeight' && typeof d.height === 'number' && d.height > 0) {
        frame.style.height = Math.max(40, d.height) + 'px';
      }
    }, false);

    function alreadyJoined() {
      closePopup();
    }

    function applyRandomHeartColor() {
      var heart = document.getElementById('heartIcon');
      if (!heart) return;
      heart.style.fill = HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)];
    }

    function addShimmer() {
      var wrapper = document.getElementById('videoWrapper');
      if (!wrapper) return;

      var shimmer = document.createElement('div');
      shimmer.id = 'iframeShimmer';
      shimmer.setAttribute('aria-hidden', 'true');
      shimmer.style.cssText = [
        'position:absolute', 'top:0', 'right:0', 'bottom:0', 'left:0', 'border-radius:inherit',
        'background:linear-gradient(90deg,#101a2e 25%,#1e2c4a 50%,#101a2e 75%)',
        'background-size:200% 100%', 'animation:shimmerSlide 1.4s linear infinite',
        'z-index:2', 'pointer-events:none'
      ].join(';');

      if (!document.getElementById('shimmerStyle')) {
        var st = document.createElement('style');
        st.id = 'shimmerStyle';
        st.textContent = '@keyframes shimmerSlide{0%{background-position:200% 0}100%{background-position:-200% 0}}';
        document.head.appendChild(st);
      }

      wrapper.style.position = 'relative';
      wrapper.insertBefore(shimmer, wrapper.firstChild);
    }

    function removeShimmer() {
      var s = document.getElementById('iframeShimmer');
      if (s && s.parentNode) s.parentNode.removeChild(s);
    }

    var currentStreamId = '';

    function showError(title, message) {
      var wrapper = document.getElementById('videoWrapper');
      var titleEl = document.getElementById('pageTitle');
      var errBox = document.getElementById('errorBox');
      removeShimmer();
      if (wrapper) wrapper.style.display = 'none';
      if (errBox) {
        errBox.textContent = message;
        errBox.style.display = 'block';
      }
      if (titleEl) titleEl.textContent = title;
    }

    function isSafeFrameUrl(url) {
      return typeof url === 'string' && url.trim() !== '' && !/^\s*(javascript|data|vbscript):/i.test(url);
    }

    function findStream(data, candidates) {
      if (!data || !Array.isArray(data.iframes)) return null;

      var index = {};
      for (var i = 0; i < data.iframes.length; i++) {
        var item = data.iframes[i];
        if (!item || item.id === undefined || item.id === null) continue;
        var key = 'k_' + String(item.id).trim().toLowerCase();
        if (!Object.prototype.hasOwnProperty.call(index, key)) index[key] = item;
      }

      for (var j = 0; j < candidates.length; j++) {
        var want = 'k_' + candidates[j].toLowerCase();
        if (Object.prototype.hasOwnProperty.call(index, want)) return index[want];
      }
      return null;
    }

    function loadStream(candidates) {
      var frame = document.getElementById('videoFrame');
      var titleEl = document.getElementById('pageTitle');

      if (!candidates.length) {
        showError('NO STREAM SELECTED', 'No stream ID found in this link. Open the link exactly as shared.');
        return;
      }

      addShimmer();

      prefetchData().then(function (data) {
        if (!data) {
          showError('CONNECTION ERROR', 'Could not load the stream list. Check your internet connection and refresh the page.');
          return;
        }

        var found = findStream(data, candidates);

        if (found && isSafeFrameUrl(found.iframeSrc)) {
          var streamName = String(found.name || '').trim() || 'Live Stream';
          currentStreamId = String(found.id).trim();

          frame.addEventListener('load', function onLoad() {
            frame.removeEventListener('load', onLoad);
            removeShimmer();
          });

          frame.addEventListener('error', function onErr() {
            frame.removeEventListener('error', onErr);
            removeShimmer();
          });

          setTimeout(removeShimmer, 12000);

          frame.src = found.iframeSrc;
          if (titleEl) titleEl.textContent = streamName;
          document.title = streamName + ' \u2013 ' + SITE_NAME;
        } else {
          showError('STREAM NOT FOUND', 'Stream Not Found');
        }
      });
    }

    /* ------------------------------------------------------------------
       URL parameter handling. All of these open the same stream:

         /?ID              short form (most used, no "=" needed)
         /?ID&utm_x=1      short form + tracking params (ignored)
         /?id=ID           classic named form
         /#ID  /#id=ID     hash fallback

       Candidates are collected in priority order (named id= first, then
       bare keys left to right) and the first one that exists in the stream
       list wins. Because matching happens against the real list, no key
       names have to be blacklisted and stream IDs like "t" or "ref" work.
       ------------------------------------------------------------------ */
    function safeDecode(v) {
      try { return decodeURIComponent(String(v).replace(/\+/g, ' ')); }
      catch (e) { return String(v); }
    }

    function collectIdCandidates(query) {
      var named = [];
      var bare = [];
      var pairs = String(query || '').replace(/^[?#]+/, '').split('&');

      for (var i = 0; i < pairs.length; i++) {
        if (!pairs[i]) continue;

        var eq = pairs[i].indexOf('=');
        var key = safeDecode(eq === -1 ? pairs[i] : pairs[i].slice(0, eq)).trim().replace(/^\/+|\/+$/g, '');
        var val = eq === -1 ? '' : safeDecode(pairs[i].slice(eq + 1)).trim();

        if (!key) continue;

        if (key.toLowerCase() === 'id') {
          if (val) named.push(val);
        } else if (!val) {
          bare.push(key);
        }
      }

      return named.concat(bare);
    }

    function resolveCandidates() {
      var list = collectIdCandidates(window.location.search);
      if (window.location.hash) list = list.concat(collectIdCandidates(window.location.hash));

      var seen = {};
      var out = [];
      for (var i = 0; i < list.length && out.length < 12; i++) {
        var id = list[i].slice(0, 100);
        var k = id.toLowerCase();
        if (!id || seen['k_' + k]) continue;
        seen['k_' + k] = true;
        out.push(id);
      }
      return out;
    }

    function buildShareUrl() {
      if (!currentStreamId) return window.location.href;
      return window.location.protocol + '//' + window.location.host + window.location.pathname +
             '?' + encodeURIComponent(currentStreamId);
    }

    var bellBusy = false;

    function openBellLink() {
      if (bellBusy) return;
      bellBusy = true;
      setTimeout(function () { bellBusy = false; }, 3000);

      if (isMobileDevice()) {
        setTimeout(function () { window.location.href = BELL_AD_URL; }, 650);
      } else {
        window.open(BELL_AD_URL, '_blank', 'noopener,noreferrer');
      }
    }

    function initBell() {
      var btn = document.getElementById('bellBtn');
      var svg = document.getElementById('bellSvg');
      if (!btn || !svg) return;

      function ring() {
        svg.classList.remove('idle', 'ringing');
        void svg.offsetWidth;
        svg.classList.add('ringing');
        setTimeout(function () {
          svg.classList.remove('ringing');
          svg.classList.add('idle');
        }, 700);
      }

      function activate() {
        ring();
        openBellLink();
      }

      btn.addEventListener('click', activate);
      btn.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          activate();
        }
      });
    }

    function copyLink(url) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url)
          .then(function () { showToast('Link Copied to Clipboard !!'); })
          .catch(function () { fallbackCopy(url); });
      } else {
        fallbackCopy(url);
      }
    }

    function initShareButton() {
      var btn = document.getElementById('shareButton');
      if (!btn) return;

      btn.addEventListener('click', function () {
        var url = buildShareUrl();
        var title = document.title;
        var text = title + '\n\nFrom ' + SITE_NAME + '\n\nWatch Live Cricket Streaming Free in HD !!';

        if (navigator.share) {
          navigator.share({ title: title, text: text, url: url }).catch(function (err) {
            // Cancelled by the user: do nothing. Any other failure: copy the link instead.
            if (err && err.name === 'AbortError') return;
            copyLink(url);
          });
          return;
        }

        copyLink(url);
      });
    }

    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0;font-size:16px;';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { ta.setSelectionRange(0, text.length); } catch (e) {}
      try {
        document.execCommand('copy');
        showToast('Link Copied to Clipboard !!');
      } catch (e) {
        alert('Link: ' + text);
      }
      document.body.removeChild(ta);
    }

    function showToast(msg) {
      var old = document.getElementById('cfcToast');
      if (old && old.parentNode) old.parentNode.removeChild(old);

      var toast = document.createElement('div');
      toast.id = 'cfcToast';
      toast.textContent = msg;
      toast.style.cssText = [
        'position:fixed',
        'bottom:calc(20px + env(safe-area-inset-bottom,0px))',
        'left:50%',
        'transform:translateX(-50%) translateY(10px)',
        'background:rgba(30,41,59,0.96)',
        'color:#fff',
        'padding:10px 20px',
        'border-radius:24px',
        'font-size:13px',
        'font-family:inherit',
        'font-weight:500',
        'white-space:nowrap',
        'z-index:9999',
        'opacity:0',
        'transition:opacity 0.3s,transform 0.3s',
        'pointer-events:none'
      ].join(';');

      document.body.appendChild(toast);

      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          toast.style.opacity = '1';
          toast.style.transform = 'translateX(-50%) translateY(0)';
        });
      });

      setTimeout(function () {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(10px)';
        setTimeout(function () {
          if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 350);
      }, 2400);
    }

    function initFullscreenHandler() {
      function handleFsChange() {
        var fsEl = document.fullscreenElement || document.webkitFullscreenElement ||
                   document.mozFullScreenElement || document.msFullscreenElement;
        var orientation = window.screen && screen.orientation;
        if (!orientation) return;

        try {
          if (fsEl) {
            // lock() returns undefined on some older browsers, so guard before .catch()
            var p = orientation.lock && orientation.lock('landscape');
            if (p && typeof p.catch === 'function') p.catch(function () {});
          } else if (orientation.unlock) {
            orientation.unlock();
          }
        } catch (e) {}
      }

      document.addEventListener('fullscreenchange', handleFsChange);
      document.addEventListener('webkitfullscreenchange', handleFsChange);
      document.addEventListener('mozfullscreenchange', handleFsChange);
      document.addEventListener('MSFullscreenChange', handleFsChange);
    }

    function initJoinCard() {
      var banner = document.getElementById('bannerLink');
      var img = document.getElementById('bannerImg');
      var wa = document.getElementById('waButton');
      var tg = document.getElementById('tgButton');
      if (banner) banner.setAttribute('href', BANNER_LINK);
      if (wa) wa.setAttribute('href', WHATSAPP_LINK);
      if (tg) tg.setAttribute('href', JOIN_LINK);
      if (img && BANNER_IMG_URL) {
        img.src = BANNER_IMG_URL;
        img.hidden = false;
      }
    }

    function initPopupButtons() {
      var btnJoined = document.getElementById('btnAlreadyJoined');
      if (btnJoined) btnJoined.addEventListener('click', alreadyJoined);

      var btnClose = document.getElementById('popupClose');
      if (btnClose) btnClose.addEventListener('click', closePopup);

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' || e.key === 'Esc') closePopup();
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      initPopupButtons();

      buildJoinFrame();
      initJoinCard();
      initBell();
      initShareButton();
      initFullscreenHandler();
      applyRandomHeartColor();
      loadStream(resolveCandidates());
    });
  </script>
