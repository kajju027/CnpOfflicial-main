  <style>
    :root {
      --bg: #08090b; --surface: #101216; --surface-2: #161a20;
      --accent: #7dffb3; --accent-soft: rgba(125, 255, 179, 0.12); --accent-line: rgba(125, 255, 179, 0.28);
      --text: #ffffff; --text-2: rgba(255, 255, 255, 0.74); --text-3: rgba(255, 255, 255, 0.48);
      --line: rgba(255, 255, 255, 0.07); --radius: 16px;
      --font-ui: 'Inter', sans-serif; --font-body: 'Merriweather', Georgia, serif;
      --ease: cubic-bezier(0.22, 0.9, 0.28, 1);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-ui); background: var(--bg); color: var(--text);
      line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .site-header {
      position: sticky; top: 0; z-index: 100; height: 72px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 28px;
      background: rgba(8, 9, 11, 0.85); backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .brand { font-size: 1.45rem; font-weight: 800; text-decoration: none; color: var(--text); letter-spacing: -0.04em; }
    .brand .cnp { color: var(--accent); }
    .nav { display: flex; align-items: center; gap: 2px; }
    .nav a {
      padding: 8px 14px; font-size: 0.875rem; font-weight: 500; color: var(--text-2);
      text-decoration: none; border-radius: 9px; transition: all .22s var(--ease);
    }
    .nav a:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    
    main { flex: 1; width: 100%; max-width: 1340px; margin: 0 auto; padding: 44px 28px 80px; }
    
    .page-head { max-width: 760px; margin: 0 auto 48px; text-align: center; }
    .page-head h1 {
      font-size: clamp(1.85rem, 5vw, 3rem); font-weight: 900; letter-spacing: -0.045em;
      line-height: 1.08; margin-bottom: 12px;
      background: linear-gradient(160deg, #ffffff 0%, rgba(255,255,255,0.62) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    
    .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
    
    .news-card {
      position: relative; display: flex; flex-direction: column; background: var(--surface);
      border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
      text-decoration: none; color: inherit; transition: transform .42s var(--ease), border-color .42s var(--ease);
    }
    .news-card:hover { transform: translateY(-6px); background: var(--surface-2); border-color: var(--accent-line); }
    
    .news-media { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #14181e; }
    .news-img { width: 100%; height: 100%; object-fit: cover; transition: transform .75s var(--ease); }
    .news-card:hover .news-img { transform: scale(1.055); }
    
    .news-body { position: relative; z-index: 2; display: flex; flex-direction: column; flex: 1; padding: 18px 22px 20px; margin-top: -22px; }
    .news-kicker { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
    .news-source { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); }
    .news-source::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(125, 255, 179, 0.14); }
    .news-time { color: var(--text-3); font-weight: 600; letter-spacing: 0.06em; font-size: 0.66rem; }
    
    .news-title {
      font-size: 1.13rem; font-weight: 700; line-height: 1.4; letter-spacing: -0.018em;
      color: rgba(255, 255, 255, 0.94); margin-bottom: 8px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .news-desc {
      font-family: var(--font-body); font-size: 0.9rem; font-weight: 300; line-height: 1.68;
      color: var(--text-3); margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 3;
      -webkit-box-orient: vertical; overflow: hidden; flex: 1;
    }
    .news-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
    .read-more { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); transition: color .3s var(--ease); }
    .news-card:hover .read-more { color: var(--accent); }
    
    .site-foot { border-top: 1px solid var(--line); padding: 40px 28px 28px; text-align: center; }
    .foot-inner { max-width: 1340px; margin: 0 auto; }
    .foot-brand { font-size: 1.3rem; font-weight: 800; text-decoration: none; color: var(--text); margin-bottom: 12px; display: inline-block; }
    .foot-brand .cnp { color: var(--accent); }
    .foot-copy { font-size: 0.78rem; color: var(--text-3); padding-top: 22px; border-top: 1px solid var(--line); }
    .foot-copy a { color: var(--text-2); text-decoration: none; }
    .foot-copy a:hover { color: var(--accent); }

<body>
  <header class="site-header">
    <a href="/" class="brand" aria-label="CnpTV Home"><span class="cnp">Cnp</span>TV</a>
    <nav class="nav" aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/#fancodeSection">FanCode</a>
      <a href="/#worldSportsSection">Sports</a>
      <a href="/#sonyLivSection">Sony</a>
      <a href="/#willow-live">Willow</a>
    </nav>
  </header>

  <main>
    <div class="page-head">
      <h1>Latest Sports News</h1>
    </div>

    <div id="news-container" class="news-grid" aria-live="polite" aria-busy="true">
      <!-- Skeletons will be here initially -->
    </div>
  </main>

  <footer class="site-foot">
    <div class="foot-inner">
      <a href="/" class="foot-brand"><span class="cnp">Cnp</span>TV</a>
      <p class="foot-copy">&copy; <span id="year"></span> <a href="/">CnpTV</a> (sayan.info) — All rights reserved.</p>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    async function loadNews() {
      const container = document.getElementById('news-container');
      try {
        const response = await fetch('/news/data.json', { cache: 'no-cache' });
        if (!response.ok) throw new Error('Network response was not ok');

        const data = await response.json();
        const articles = Array.isArray(data.articles) ? data.articles : [];

        if (articles.length === 0) throw new Error('No articles found');

        const frag = document.createDocumentFragment();
        let validCount = 0;

        for (let i = 0; i < articles.length; i++) {
          const article = articles[i];
          const card = buildCard(article, validCount);
          
          // Frontend Validation: Wait for image to load before adding to DOM
          const img = card.querySelector('.news-img');
          try {
            await new Promise((resolve, reject) => {
              img.onload = resolve;
              img.onerror = reject;
              setTimeout(reject, 4000); // 4 second timeout
            });
            frag.appendChild(card);
            validCount++;
          } catch (e) {
            // Silently skip this card if image fails to load
            console.log(`Skipped: ${article.title} (Image failed)`);
          }
        }

        if (validCount === 0) throw new Error('No valid articles with images');

        container.innerHTML = '';
        container.appendChild(frag);
        container.setAttribute('aria-busy', 'false');

      } catch (err) {
        container.setAttribute('aria-busy', 'false');
        container.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-3);">
            <h3 style="color: var(--text); margin-bottom: 8px;">Unable to load the news feed</h3>
            <p>Please check your connection and try again in a moment.</p>
          </div>
        `;
      }
    }

    function buildCard(article, index) {
      const date = new Date(article.pubDate);
      const validDate = !isNaN(date.getTime());
      const timeAgo = validDate ? getTimeAgo(date) : 'Recently';

      const card = document.createElement('a');
      card.className = 'news-card';
      card.href = article.link || '#';
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.style.animationDelay = Math.min(index * 55, 500) + 'ms';

      const source  = escapeHtml(article.source || 'Sports');
      const title   = escapeHtml(article.title || 'Untitled story');
      const desc    = escapeHtml(article.description || '');
      const imgSrc  = escapeHtml(article.image || 'https://sayan.info/assets/android-chrome-512x512.png').trim();

      card.innerHTML = `
        <div class="news-media">
          <img class="news-img" src="${imgSrc}" alt="${title}" loading="lazy" decoding="async">
        </div>
        <div class="news-body">
          <div class="news-kicker">
            <span class="news-source">${source}</span>
            <span class="news-time">${timeAgo}</span>
          </div>
          <h2 class="news-title">${title}</h2>
          ${desc ? `<p class="news-desc">${desc}</p>` : ''}
          <div class="news-foot">
            <span class="read-more">Read Story →</span>
          </div>
        </div>
      `;
      return card;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function getTimeAgo(date) {
      const seconds = Math.floor((Date.now() - date.getTime()) / 1000);
      if (seconds < 45) return 'Just now';
      const units = [['year', 31536000], ['month', 2592000], ['week', 604800], ['day', 86400], ['hour', 3600], ['minute', 60]];
      for (const [name, secs] of units) {
        const val = Math.floor(seconds / secs);
        if (val >= 1) return val + ' ' + name + (val > 1 ? 's' : '') + ' ago';
      }
      return 'Just now';
    }

    loadNews();
  </script>
