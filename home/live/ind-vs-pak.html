    .header {

      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(14px, 2.5vh, 22px) clamp(16px, 4vw, 36px);
      background: rgba(5, 5, 5, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 50;
      min-height: clamp(56px, 7vh, 72px);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);

    .header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(249, 115, 22, 0.4), transparent);

      -webkit-text-fill-color: transparent;
      background-clip: text;

    .main {

      min-height: calc(100dvh - clamp(56px, 7vh, 72px));
      display: flex;
      flex-direction: column;
      width: 100%;

      overflow: hidden;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);

    @media (min-width: 900px) {
      .player-wrapper { 
        padding-bottom: 0; 
        height: min(60vw, 82vh); 
        max-height: 82vh; 
      }
    }

    .player-wrapper iframe {
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      border: none; 
      background: #000000;
      z-index: 1;
    }

      padding: 18px 20px 10px;

      font-weight: 800;

      letter-spacing: -0.2px;

      font-size: 22px;

      gap: 14px;
      padding: 12px 20px 26px;
      max-width: 1020px;
      margin: 0 auto;
      width: 100%;

    @media (min-width: 640px) {

        grid-template-columns: repeat(3, 1fr); 
        gap: 16px;

      border-radius: 14px;
      padding: 2px;
      cursor: pointer;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);

      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      transition: var(--transition);
      width: 100%;
      height: 100%;

      font-weight: 800; 
      font-size: 1.05rem; 
      color: #f0f2f5; 
      letter-spacing: 0.2px; 
      transition: var(--transition);
    }

    .channel-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 18px rgba(249, 115, 22, 0.2);
      border-color: rgba(249, 115, 22, 0.4);
    }

    .channel-card:hover .name {
      color: #ffffff;
    }

    /* Active Channel: Rotating Border Beam Animation */
    .channel-card.active {
      border-color: transparent;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7), 0 0 25px rgba(249, 115, 22, 0.35);
    }

    .channel-card.active::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent 0%, #f97316 25%, #ffea00 48%, #ffffff 58%, #f97316 75%, transparent 100%);
      animation: rotateBorder 3s linear infinite;
      z-index: 1;
    }

    .channel-card.active .channel-card-inner {
      background: linear-gradient(145deg, #1f1612 0%, #15110e 100%);
    }

    .channel-card.active .name {
      color: #ffffff;
      text-shadow: 0 0 12px rgba(249, 115, 22, 0.6);
    }

    @keyframes rotateBorder {

      100% { transform: rotate(360deg); }

    }
  </style>
