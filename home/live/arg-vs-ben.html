      const grid = document.getElementById('channelsGrid');
      const playerIframe = document.querySelector('.player-wrapper iframe');
      const waOverlay = document.getElementById('waOverlay');

      function showPopupWithDelay() {
        setTimeout(function() {
          waOverlay.classList.add('show');
        }, 2000);
      }

      function renderChannels(activeIndex) {
        grid.innerHTML = channels.map((ch, index) => `
          <div class="channel-card ${index === activeIndex ? 'active' : ''}" data-index="${index}">
            <div class="channel-card-inner">
              <span class="name">${ch.name}</span>
            </div>
          </div>
        `).join('');

        grid.querySelectorAll('.channel-card').forEach(card => {
          card.addEventListener('click', function() {
            const idx = parseInt(this.dataset.index);
            switchChannel(idx);
          });
        });
      }

      function switchChannel(index) {
        const ch = channels[index];
        if (!ch) return;

        // If Adv 4K / Advertisement clicked, open directly in a new tab without altering the player iframe
        if (ch.name === 'Adv 4K' || ch.name === 'Advertisement') {
          window.open(ch.url, '_blank');
          return;
        }

        playerIframe.src = ch.url;

        // Move active rotating border beam animation state to clicked channel card
        grid.querySelectorAll('.channel-card').forEach(c => {
          c.classList.toggle('active', parseInt(c.dataset.index) === index);
        });

        // Trigger WhatsApp Popup again on channel switch with 2s delay
        showPopupWithDelay();
      }

      // Initial channel render with index 0 active
      renderChannels(0);

      // Initial popup trigger (2 seconds)
      showPopupWithDelay();

      // Dynamic Ad Injection Logic
      let adLoaded = false;
      function injectAdScript() {
        if (adLoaded) return;
        adLoaded = true;
        const script = document.createElement('script');
        script.src = AD_SCRIPT_SRC;
        script.async = true;
        document.body.appendChild(script);
      }

      if (sessionStorage.getItem('enable_site_ads') === 'true') {
        injectAdScript();
      }

      // Join Now: Opens WhatsApp Channel, Closes Popup, NO ADS
      document.getElementById('joinNow').onclick = function() {
        window.open(WHATSAPP_LINK, '_blank');
        waOverlay.classList.remove('show');
      };

      // Already Joined: Closes Popup, Activates Ads
      document.getElementById('joinedBtn').onclick = function() {
        waOverlay.classList.remove('show');
        sessionStorage.setItem('enable_site_ads', 'true');
        injectAdScript();
      };

      waOverlay.addEventListener('click', function(e) {
        if (e.target === waOverlay) {
          waOverlay.classList.remove('show');
        }
      });

    })();
