<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | MatchDekho</title>
    <style>
        /* Modern 2026 404 Page Styling */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .error-container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.08);
            border: 1px solid #eee;
        }

        .error-code {
            font-size: 100px;
            font-weight: 800;
            margin: 0;
            color: #00A86B;
            line-height: 1;
            letter-spacing: -5px;
        }

        .error-message {
            font-size: 20px;
            margin: 20px 0 30px 0;
            color: #666;
            font-weight: 500;
        }

        .home-btn {
            background-color: #00A86B;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.3s ease;
            display: inline-block;
        }

        .home-btn:hover {
            background-color: #007a4f;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <p class="error-message">The page you are looking for doesn't exist or has been moved.</p>
        <a href="index.html" class="home-btn">Back to Homepage</a>
    </div>
</body>
</html>
