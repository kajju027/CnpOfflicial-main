name: Fetch Sports News

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Fetch and compile news
        run: |
          python3 << 'EOF'
          import feedparser
          import json
          import os
          import re
          from datetime import datetime
          import requests

          feeds = [
              {"url": "https://www.indiatoday.in/rss/1206550", "source": "India Today"},
              {"url": "https://www.hindustantimes.com/feeds/rss/cricket/rssfeed.xml", "source": "HT Cricket"},
              {"url": "https://www.hindustantimes.com/feeds/rss/sports/football/rssfeed.xml", "source": "HT Football"},
              {"url": "https://www.hindustantimes.com/feeds/rss/sports/rssfeed.xml", "source": "HT Sports"},
              {"url": "https://api.foxsports.com/v2/content/optimized-rss?partnerKey=MB0Wehpmuj2lUhuRhQaafhBjAJqaPU244mlTDK1i&aggregateId=7f83e8ca-6701-5ea0-96ee-072636b67336", "source": "Fox Sports"}
          ]

          news_items = []
          default_image = "https://sayan.info/assets/android-chrome-512x512.png"

          def is_image_valid(url):
              """Check if image URL is valid and accessible"""
              if not url or url == default_image:
                  return False
              try:
                  # Check if URL is accessible (head request for speed)
                  response = requests.head(url, timeout=3, allow_redirects=True)
                  content_type = response.headers.get('content-type', '')
                  return response.status_code == 200 and 'image' in content_type
              except:
                  return False

          for feed_info in feeds:
              try:
                  feed = feedparser.parse(feed_info["url"])
                  for entry in feed.entries:
                      image = None
                      
                      # Extract image from various RSS formats
                      if hasattr(entry, 'media_content') and len(entry.media_content) > 0:
                          image = entry.media_content[0].get('url')
                      elif hasattr(entry, 'media_thumbnail') and len(entry.media_thumbnail) > 0:
                          image = entry.media_thumbnail[0].get('url')
                      elif hasattr(entry, 'links'):
                          for link in entry.links:
                              if link.get('rel') == 'enclosure' and 'image' in link.get('type', ''):
                                  image = link.get('href')
                                  break
                      elif hasattr(entry, 'image'):
                          image = entry.image.get('href')
                      
                      # Skip if no image found
                      if not image or image == default_image:
                          continue
                      
                      # Validate image URL
                      if not is_image_valid(image):
                          continue

                      # Clean description
                      raw_desc = entry.get('description', entry.get('summary', entry.get('content', [{'value': ''}])[0].get('value', 'No description available.')))
                      clean_desc = re.sub(r'<[^>]+>', '', str(raw_desc)).strip()
                      clean_desc = re.sub(r'\s+', ' ', clean_desc)
                      if len(clean_desc) > 250:
                          clean_desc = clean_desc[:250] + "..."

                      # Identify cricket news for prioritization
                      text_to_check = (entry.get('title', '') + ' ' + feed_info['source'] + ' ' + clean_desc).lower()
                      is_cricket = 'cricket' in text_to_check or 'ipl' in text_to_check or 'wc' in text_to_check or 't20' in text_to_check

                      news_items.append({
                          "title": entry.get('title', 'No Title'),
                          "link": entry.get('link', '#'),
                          "description": clean_desc,
                          "image": image,
                          "pubDate": entry.get('published', entry.get('updated', datetime.now().isoformat())),
                          "source": feed_info["source"],
                          "_is_cricket": is_cricket
                      })
              except Exception as e:
                  print(f"Error fetching {feed_info['source']}: {e}")
                  continue

          # Robust date parsing for sorting
          def parse_date(date_str):
              try:
                  if isinstance(date_str, tuple):
                      return datetime(*date_str[:6])
                  return datetime.strptime(date_str, "%a, %d %b %Y %H:%M:%S %Z")
              except:
                  return datetime.min

          # Sort 1: By Date (Newest first)
          news_items.sort(key=lambda x: parse_date(x['pubDate']), reverse=True)
          # Sort 2: Stable sort to put Cricket (True) at the very top
          news_items.sort(key=lambda x: x['_is_cricket'], reverse=True)

          # Remove internal flag and limit to 150
          final_items = []
          for item in news_items[:150]:
              del item['_is_cricket']
              final_items.append(item)

          os.makedirs('news', exist_ok=True)
          with open('news/data.json', 'w', encoding='utf-8') as f:
              json.dump({"last_updated": datetime.now().isoformat(), "articles": final_items}, f, indent=2)
          
          print(f"Successfully fetched {len(final_items)} articles with valid images")
          EOF

      - name: Commit and push if changes exist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/data.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update sports news feed (filtered valid images only)"
            git push
          fi
