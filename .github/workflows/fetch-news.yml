name: Fetch Sports News

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch and compile news
        run: |
          python3 << 'EOF'
          import feedparser
          import json
          import os
          import re
          from datetime import datetime

          feeds = [
              {"url": "https://www.indiatoday.in/rss/1206550", "source": "India Today"},
              {"url": "https://www.hindustantimes.com/feeds/rss/cricket/rssfeed.xml", "source": "HT Cricket"},
              {"url": "https://www.hindustantimes.com/feeds/rss/sports/football/rssfeed.xml", "source": "HT Football"},
              {"url": "https://www.hindustantimes.com/feeds/rss/sports/rssfeed.xml", "source": "HT Sports"},
              {"url": "https://api.foxsports.com/v2/content/optimized-rss?partnerKey=MB0Wehpmuj2lUhuRhQaafhBjAJqaPU244mlTDK1i&aggregateId=7f83e8ca-6701-5ea0-96ee-072636b67336", "source": "Fox Sports"}
          ]

          news_items = []
          default_image = "https://sayan.info/assets/android-chrome-512x512.png"

          for feed_info in feeds:
              try:
                  feed = feedparser.parse(feed_info["url"])
                  for entry in feed.entries:
                      image = None
                      
                      # Robust image extraction
                      if hasattr(entry, 'media_content') and len(entry.media_content) > 0:
                          image = entry.media_content[0].get('url')
                      elif hasattr(entry, 'media_thumbnail') and len(entry.media_thumbnail) > 0:
                          image = entry.media_thumbnail[0].get('url')
                      elif hasattr(entry, 'links'):
                          for link in entry.links:
                              if link.get('rel') == 'enclosure' and 'image' in link.get('type', ''):
                                  image = link.get('href')
                                  break
                      
                      # Skip if no valid image found at backend
                      if not image or image == default_image or len(image) < 10:
                          continue

                      # Safe description extraction
                      raw_desc = "No description available."
                      if hasattr(entry, 'summary'):
                          raw_desc = entry.summary
                      elif hasattr(entry, 'description'):
                          raw_desc = entry.description
                      elif hasattr(entry, 'content') and len(entry.content) > 0:
                          raw_desc = entry.content[0].value

                      # Clean HTML tags and extra spaces
                      clean_desc = re.sub(r'<[^>]+>', '', str(raw_desc)).strip()
                      clean_desc = re.sub(r'\s+', ' ', clean_desc)
                      if len(clean_desc) > 220:
                          clean_desc = clean_desc[:220] + "..."

                      # Cricket prioritization logic
                      text_to_check = (entry.get('title', '') + ' ' + clean_desc).lower()
                      is_cricket = any(word in text_to_check for word in ['cricket', 'ipl', 't20', 'world cup', 'kohli', 'rohit', 'dhoni'])

                      news_items.append({
                          "title": entry.get('title', 'Sports Update'),
                          "link": entry.get('link', '#'),
                          "description": clean_desc,
                          "image": image,
                          "pubDate": entry.get('published', entry.get('updated', datetime.now().isoformat())),
                          "source": feed_info["source"],
                          "_is_cricket": is_cricket
                      })
              except Exception as e:
                  print(f"Error fetching {feed_info['source']}: {e}")
                  continue

          # Date parsing for sorting
          def parse_date(date_str):
              try:
                  if isinstance(date_str, tuple):
                      return datetime(*date_str[:6])
                  return datetime.strptime(date_str, "%a, %d %b %Y %H:%M:%S %Z")
              except:
                  return datetime.min

          # Sort: 1. Cricket first, 2. Newest first
          news_items.sort(key=lambda x: parse_date(x['pubDate']), reverse=True)
          news_items.sort(key=lambda x: x['_is_cricket'], reverse=True)

          # Remove internal flag, keep ALL valid items (no arbitrary limit)
          final_items = []
          for item in news_items:
              del item['_is_cricket']
              final_items.append(item)

          os.makedirs('news', exist_ok=True)
          with open('news/data.json', 'w', encoding='utf-8') as f:
              json.dump({"last_updated": datetime.now().isoformat(), "articles": final_items}, f, indent=2)
          
          print(f"Successfully compiled {len(final_items)} news articles.")
          EOF

      - name: Commit and push if changes exist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/data.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update comprehensive sports news feed"
            git push
          fi
