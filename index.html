  <style>
    html, body { background: #0b0d0f !important; color: #fff !important; font-family: 'Inter', sans-serif; }
    .section-hd-title { margin: 0 !important; font-size: 1.5rem; font-weight: 700; }
    .section-hd { margin-bottom: clamp(1.15rem, 2.6vw, 2rem) !important; display: flex; align-items: center; gap: 12px; }
    .section-hd-rule {
      display: block !important;
      width: 30px !important;
      height: 3px !important;
      border-radius: 999px !important;
      background: linear-gradient(90deg, #f5c518, rgba(245, 197, 24, 0.15)) !important;
    }
    
    /* News Section Specific Styles */
    .news-section { margin-bottom: clamp(2rem, 4vw, 3rem); padding: 0 16px; }
    .news-track {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .news-card-landing {
      background: #13161a;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.3s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .news-card-landing:hover {
      transform: translateY(-4px);
      border-color: #7dffb3;
    }
    .news-card-img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #1a1d21;
    }
    .news-card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; }
    .news-card-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .news-card-time {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .news-read-more {
      background: rgba(125, 255, 179, 0.08);
      border: 1px dashed rgba(125, 255, 179, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      min-height: 250px;
    }
    .news-read-more:hover {
      background: rgba(125, 255, 179, 0.15);
      border-color: #7dffb3;
    }
    .news-read-more span {
      color: #7dffb3;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 8px;
    }
    .news-read-more p {
      color: rgba(255,255,255,0.6);
      font-size: 0.85rem;
    }

    /* Footer Styles */
    .site-foot {
      background: #0b0d0f !important;
      color: rgba(255, 255, 255, 0.72) !important;
      padding: 40px 16px 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 40px;
    }
    .site-foot-container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
    }
    @media (min-width: 768px) {
      .site-foot-container { grid-template-columns: 1.5fr 2fr; }
    }
    .site-foot-brand {
      font-size: 1.5rem;
      font-weight: 800;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 12px;
    }
    .site-foot .cnp { color: #7dffb3 !important; }
    .site-foot .tv { color: #ffffff !important; }
    .site-foot-desc { font-size: 0.9rem; line-height: 1.5; margin-bottom: 16px; max-width: 320px; }
    .site-foot-nav { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
    @media (min-width: 768px) { .site-foot-nav { grid-template-columns: repeat(4, 1fr); } }
    .foot-nav-title {
      font-size: 0.85rem; font-weight: 700; color: #ffffff !important;
      text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 12px 0;
    }
    .site-foot-nav a {
      display: block; color: rgba(255, 255, 255, 0.7) !important;
      text-decoration: none !important; font-size: 0.9rem; padding: 4px 0;
      transition: color 0.2s ease;
    }
    .site-foot-nav a:hover { color: #7dffb3 !important; }
    .site-foot-bottom {
      max-width: 1200px; margin: 32px auto 0; padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08); text-align: center;
    }
    .site-foot-copy { font-size: 0.8rem; color: rgba(255, 255, 255, 0.5) !important; margin: 0; }
