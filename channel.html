<title>CNPTV</title>
<noscript>
  <meta http-equiv="refresh" content="0;url=https://whatsapp.com/channel/0029VbBjdsD9Bb63qmSGBY2f">
</noscript>
<script>
(function () {
  var id  = "0029VbBjdsD9Bb63qmSGBY2f";
  var web = "https://whatsapp.com/channel/" + id;
  var app = "whatsapp://channel/" + id;

  var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

  if (!isMobile) {
    window.location.replace(web);
    return;
  }

  var fallback = setTimeout(function () {
    window.location.replace(web);
  }, 1500);

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) clearTimeout(fallback);
  });

  window.location.href = app;
})();
</script>
