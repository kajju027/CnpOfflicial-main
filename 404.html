<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>404 - Page Not Found | CnpTV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0d0f;
      color: #ffffff;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.016) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.016) 1px, transparent 1px);
      background-size: 52px 52px;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      top: -15%;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 600px;
      background: radial-gradient(ellipse at center,
        rgba(52, 211, 153, 0.07) 0%,
        transparent 68%);
      pointer-events: none;
    }

    .brand .cnp { color: #7dffb3; }
    .brand .tv  { color: #ffffff; }

    .brand {
      position: fixed;
      top: clamp(16px, 3vw, 28px);
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      white-space: nowrap;
      z-index: 10;
    }

    .card {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      max-width: 520px;
      width: 100%;
    }

    .code {
      font-size: clamp(6rem, 21vw, 13rem);
      font-weight: 900;
      line-height: 0.92;
      letter-spacing: -0.07em;
      color: transparent;
      background: linear-gradient(160deg, #ffffff 18%, rgba(255, 255, 255, 0.38) 100%);
      -webkit-background-clip: text;
      background-clip: text;

      filter:
        drop-shadow(0 0 48px rgba(52, 211, 153, 0.20))
        drop-shadow(0 24px 52px rgba(0, 0, 0, 0.72));
      user-select: none;
      margin-bottom: 0.18em;
    }

    .rule {
      width: 52px;
      height: 3px;
      background: linear-gradient(90deg, #ffe05c, #f5b900);
      border-radius: 999px;
      box-shadow: 0 0 18px rgba(245, 197, 24, 0.42);
      margin: 0 auto 1.25rem;
    }

    .heading {
      font-size: clamp(1.1rem, 3.2vw, 1.55rem);
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
      margin-bottom: 0.55rem;
    }

    .message {
      font-size: clamp(0.82rem, 2vw, 0.98rem);
      color: rgba(255, 255, 255, 0.46);
      line-height: 1.65;
      max-width: 360px;
      margin: 0 auto 2rem;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 12px 28px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffe05c, #f5b900);
      color: #111111;
      font-family: inherit;
      font-size: clamp(0.82rem, 1.8vw, 0.92rem);
      font-weight: 800;
      letter-spacing: 0.015em;
      text-decoration: none;
      cursor: pointer;
      box-shadow:
        0 6px 26px rgba(245, 197, 24, 0.28),
        0 2px 6px rgba(0, 0, 0, 0.36);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow:
        0 12px 34px rgba(245, 197, 24, 0.38),
        0 4px 10px rgba(0, 0, 0, 0.46);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 12px 22px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.72);
      font-family: inherit;
      font-size: clamp(0.82rem, 1.8vw, 0.92rem);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 255, 255, 0.26);
      color: rgba(255, 255, 255, 0.92);
    }

    .hint {
      position: fixed;
      bottom: clamp(16px, 3vw, 26px);
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.20);
      font-size: 0.72rem;
      white-space: nowrap;
    }

    @media (max-width: 400px) {
      .code { font-size: 5.5rem; }
      .btn-primary, .btn-secondary { padding: 11px 18px; font-size: 0.80rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <a href="/" class="brand" aria-label="CnpTV home">
    <span class="cnp">Cnp</span><span class="tv">TV</span>
  </a>

  <div class="card" role="main">
    <p class="code" aria-label="Error code 404">404</p>
    <div class="rule" aria-hidden="true"></div>
    <h1 class="heading">Page Not Found</h1>
    <p class="message">
      The page you are looking for has moved, been removed, or never existed.
      Head back and catch something live.
    </p>
    <div class="actions">
      <a href="/" class="btn-primary">&#9654;&nbsp; Go to Home</a>
      <a href="javascript:history.back()" class="btn-secondary">&#8592;&nbsp; Go Back</a>
    </div>
  </div>

  <p class="hint" aria-hidden="true">CnpTV - 2026</p>

</body>
</html>
