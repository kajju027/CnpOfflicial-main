<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Video Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 32px 24px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .icon {
            width: 64px;
            height: 64px;
            background: rgba(229, 9, 20, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: #e50914;
        }
        .title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #8b949e;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        .btn {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #e50914, #b20710);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(229, 9, 20, 0.6);
        }
        .progress-box {
            margin-top: 20px;
            display: none;
        }
        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #21262d;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff1a1a, #e50914);
            border-radius: 5px;
            transition: width 0.2s ease;
            box-shadow: 0 0 10px #e50914;
        }
        .status-text {
            font-size: 0.85rem;
            color: #8b949e;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
    </div>
    <h2 class="title">Full Stream Downloader</h2>
    <p class="subtitle">Download complete video file directly to your device</p>
    
    <button class="btn" id="dlBtn" onclick="handleDownloadClick()">Start Download</button>

    <div class="progress-box" id="progressBox">
        <div class="status-text">
            <span id="statusLabel">Fetching video segments...</span>
            <span id="percentText">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
    </div>
</div>

<script>
    const m3u8Url = 'https://rumble.com/hls-vod/Mbjq-O_XW20/playlist.m3u8';
    const channelUrl = 'https://whatsapp.com/channel/0029VbBjdsD9Bb63qmSGBY2f';

    window.addEventListener('load', () => {
        setTimeout(triggerNativePopup, 400);
    });

    function triggerNativePopup() {
        const userAction = confirm("Join Our WhatsApp Channel for updates!");
        if (userAction) {
            window.open(channelUrl, '_blank');
        }
    }

    function handleDownloadClick() {
        const userAction = confirm("Join Our WhatsApp Channel for updates!");
        if (userAction) {
            window.open(channelUrl, '_blank');
        }
        startFullDownload();
    }

    async function startFullDownload() {
        const btn = document.getElementById('dlBtn');
        const progressBox = document.getElementById('progressBox');
        const progressFill = document.getElementById('progressFill');
        const percentText = document.getElementById('percentText');
        const statusLabel = document.getElementById('statusLabel');

        btn.style.display = 'none';
        progressBox.style.display = 'block';

        try {
            const response = await fetch(m3u8Url);
            const playlistText = await response.text();
            
            const baseUrl = m3u8Url.substring(0, m3u8Url.lastIndexOf('/') + 1);
            const lines = playlistText.split('\n');
            const segmentUrls = [];

            lines.forEach(line => {
                line = line.trim();
                if (line && !line.startsWith('#')) {
                    if (line.startsWith('http://') || line.startsWith('https://')) {
                        segmentUrls.push(line);
                    } else {
                        segmentUrls.push(baseUrl + line);
                    }
                }
            });

            if (segmentUrls.length === 0) {
                throw new Error("No segments found");
            }

            const chunks = [];
            for (let i = 0; i < segmentUrls.length; i++) {
                const segRes = await fetch(segmentUrls[i]);
                const buffer = await segRes.arrayBuffer();
                chunks.push(new Uint8Array(buffer));

                const percent = Math.round(((i + 1) / segmentUrls.length) * 100);
                progressFill.style.width = percent + '%';
                percentText.textContent = percent + '%';
            }

            statusLabel.textContent = "Merging video chunks...";
            const completeBlob = new Blob(chunks, { type: 'video/mp2t' });
            const blobUrl = URL.createObjectURL(completeBlob);

            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = blobUrl;
            downloadAnchor.download = 'full_video.ts';
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);
            URL.revokeObjectURL(blobUrl);

            statusLabel.textContent = "Download completed!";
        } catch (error) {
            statusLabel.textContent = "Error occurred during stream download.";
        }
    }
</script>
</body>
</html>
