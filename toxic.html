<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS Stream Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .downloader-card {
            background: #141414;
            border: 1px solid #282828;
            border-radius: 16px;
            padding: 36px 24px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
        }
        .icon-wrapper {
            width: 68px;
            height: 68px;
            background: rgba(229, 9, 20, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            color: #e50914;
        }
        .title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #808080;
            font-size: 0.9rem;
            margin-bottom: 28px;
            line-height: 1.4;
        }
        .action-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff1a1a, #cc0000);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .action-btn:active {
            transform: scale(0.98);
        }
        .progress-box {
            margin-top: 24px;
            display: none;
        }
        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #262626;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #e50914;
            box-shadow: 0 0 12px #e50914;
            transition: width 0.1s linear;
        }
        .status-info {
            font-size: 0.85rem;
            color: #a3a3a3;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="downloader-card">
    <div class="icon-wrapper">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
    </div>
    <h2 class="title">Full Stream Downloader</h2>
    <p class="subtitle">Download complete high-capacity HLS video files directly to device memory without crash</p>
    
    <button class="action-btn" id="startBtn" onclick="initiateProcess()">Start Download</button>

    <div class="progress-box" id="progressContainer">
        <div class="status-info">
            <span id="statusText">Initializing stream...</span>
            <span id="percentLabel">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
    </div>
</div>

<script>
    const m3u8Url = 'https://rumble.com/hls-vod/Mbjq-O_XW20/playlist.m3u8';
    const channelUrl = 'https://whatsapp.com/channel/0029VbBjdsD9Bb63qmSGBY2f';

    window.addEventListener('load', () => {
        setTimeout(showPopup, 300);
    });

    function showPopup() {
        const confirmAction = confirm("Join Our WhatsApp Channel for updates!");
        if (confirmAction) {
            window.open(channelUrl, '_blank');
        }
    }

    function initiateProcess() {
        showPopup();
        executeStreamDownload();
    }

    async function fetchPlaylist(url) {
        const res = await fetch(url);
        const text = await res.text();
        return text;
    }

    async function executeStreamDownload() {
        const startBtn = document.getElementById('startBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const percentLabel = document.getElementById('percentLabel');
        const statusText = document.getElementById('statusText');

        startBtn.style.display = 'none';
        progressContainer.style.display = 'block';

        try {
            let playlistText = await fetchPlaylist(m3u8Url);
            let targetPlaylistUrl = m3u8Url;

            if (playlistText.includes('#EXT-X-STREAM-INF')) {
                const lines = playlistText.split('\n');
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('#EXT-X-STREAM-INF')) {
                        const nextLine = lines[i + 1].trim();
                        if (nextLine.startsWith('http')) {
                            targetPlaylistUrl = nextLine;
                        } else {
                            const baseUrl = m3u8Url.substring(0, m3u8Url.lastIndexOf('/') + 1);
                            targetPlaylistUrl = baseUrl + nextLine;
                        }
                        break;
                    }
                }
                playlistText = await fetchPlaylist(targetPlaylistUrl);
            }

            const baseSegmentUrl = targetPlaylistUrl.substring(0, targetPlaylistUrl.lastIndexOf('/') + 1);
            const rawLines = playlistText.split('\n');
            const segmentUrls = [];

            rawLines.forEach(line => {
                line = line.trim();
                if (line && !line.startsWith('#')) {
                    if (line.startsWith('http://') || line.startsWith('https://')) {
                        segmentUrls.push(line);
                    } else {
                        segmentUrls.push(baseSegmentUrl + line);
                    }
                }
            });

            if (segmentUrls.length === 0) {
                throw new Error("Invalid playlist content");
            }

            let fileHandle = null;
            let writableStream = null;

            if ('showSaveFilePicker' in window) {
                try {
                    fileHandle = await window.showSaveFilePicker({
                        suggestedName: 'video_stream.ts',
                        types: [{
                            description: 'Video File',
                            accept: {'video/mp2t': ['.ts']}
                        }]
                    });
                    writableStream = await fileHandle.createWritable();
                } catch (e) {
                    writableStream = null;
                }
            }

            const chunks = [];
            for (let i = 0; i < segmentUrls.length; i++) {
                const segResponse = await fetch(segmentUrls[i]);
                const arrayBuffer = await segResponse.arrayBuffer();

                if (writableStream) {
                    await writableStream.write(arrayBuffer);
                } else {
                    chunks.push(new Uint8Array(arrayBuffer));
                }

                const percent = Math.round(((i + 1) / segmentUrls.length) * 100);
                progressFill.style.width = percent + '%';
                percentLabel.textContent = percent + '%';
                statusText.textContent = `Downloading segment ${i + 1}/${segmentUrls.length}...`;
            }

            if (writableStream) {
                await writableStream.close();
                statusText.textContent = "Saved to storage!";
            } else {
                statusText.textContent = "Building final video file...";
                const blob = new Blob(chunks, { type: 'video/mp2t' });
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = 'video_stream.ts';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
                statusText.textContent = "Download Complete!";
            }

        } catch (err) {
            statusText.textContent = "Failed to download HLS stream.";
        }
    }
</script>
</body>
</html>
